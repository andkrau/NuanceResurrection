# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

.core-defs:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CORENAME: nuance
    CORE_ARGS: -DBUILD_LIBRETRO=ON

include:
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-x86.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios-cmake.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/tvos-cmake.yml'

stages:
  - build-prepare
  - build-shared

##############################################################################
#################################### STAGES ##################################
##############################################################################

libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs

# Linux 32-bit (i686). The x86 emitter this build uses is the one the project
# started on, and the SSSE3 flag it needs is now applied wherever the compiler
# takes it, so this is the same code path as x86_64 minus asmjit.
libretro-build-linux-i686:
  extends:
    - .libretro-linux-cmake-x86
    - .core-defs

# Linux ARM 64-bit (aarch64). The buildbot provides an aarch64 image/runner
# via .libretro-linux-cmake-aarch64.
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs

libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs

# Windows 32-bit (i686). The same code path as the 32-bit Linux job - the
# legacy x86 emitter and the SSSE3 flag it needs - built with MinGW instead of
# GCC. No asmjit here either: that is the 64-bit JIT.
libretro-build-windows-i686:
  extends:
    - .libretro-windows-cmake-x86
    - .core-defs

# macOS 64-bit
libretro-build-osx-x64:
  extends:
    # -x86_64, not -x86: the latter is the 32-bit macOS class and sets ARCH=x86.
    - .libretro-osx-cmake-x86_64
    - .core-defs

# macOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs

# The OpenGL ES targets. All three run the same code as the desktop builds -
# interpreter, since none of them is x86-64 - with the renderer going through
# vertex attributes and a GLES2 context instead of the fixed-function pipeline.
libretro-build-android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs

# The one Android ABI that takes the asmjit JIT path, being x86-64.
libretro-build-android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .core-defs

libretro-build-ios-arm64:
  extends:
    - .libretro-ios-cmake-arm64
    - .core-defs

libretro-build-tvos-arm64:
  extends:
    - .libretro-tvos-cmake-arm64
    - .core-defs
